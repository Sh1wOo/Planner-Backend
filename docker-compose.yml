version: "3.8"
services:
  web:
    build: .
    ports:
      - "7878:7878"
    env_file: .env
    environment:
      - PORT=7878
    volumes:
      - ./:/app:cached
    depends_on: []

  # Example postgres for local testing (optional)
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: planner
      POSTGRES_PASSWORD: planner
      POSTGRES_DB: planner_db
    ports:
      - "5432:5432"
